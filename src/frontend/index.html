<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Energy Visualisations</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Mapbox GL JS & CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
</head>
<body>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
        <div id="sidebar-header">
            <h1>UK Energy</h1>
            <p>Live generation & maps</p>
        </div>
        
        <div class="nav-item active" data-target="tab-generation">
            Live Generation
        </div>
        <div class="nav-item" data-target="tab-maps">
            Maps
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
        
        <!-- Live Generation Tab (Default) -->
        <div id="tab-generation" class="tab-content active">
            <div id="charts-container">
                <div class="chart-header">
                    <h2>Generation by Fuel Type</h2>
                    <p>Live outturn generation across Great Britain (BMRS)</p>
                </div>
                <div class="chart-card">
                    <canvas id="generationChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Maps Tab -->
        <div id="tab-maps" class="tab-content">
            <!-- UI Overlay for Maps -->
            <div id="map-overlay">
                <!-- Dropdown -->
                <div class="glass-panel">
                    <select id="map-selector" class="custom-select">
                        <option value="solar">Solar PV Generation</option>
                        <!-- Future maps will be added here -->
                    </select>
                </div>

                <!-- Total Stats Card (Currently tied to Solar map) -->
                <div id="solar-stats" class="glass-panel">
                    <div class="stats-title">Total GB Output</div>
                    <div class="stats-value">
                        <span id="total-gen-display" class="stats-number">--</span>
                        <span class="stats-unit">MW</span>
                    </div>
                    <div class="status-indicator">
                        <div class="status-dot pulse" id="status-dot"></div>
                        <span id="status-text">Connecting...</span>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div id="map"></div>
        </div>

    </main>

    <!-- Application Modules -->
    <script type="module" src="app.js"></script>

</body>
</html>
