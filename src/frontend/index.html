<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Energy Visualisations</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Mapbox GL JS & CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet">

</head>
<body>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
        <div id="sidebar-header">
            <h1>UK Energy</h1>
            <p>Live generation & maps</p>
        </div>
        
        <div class="nav-item active" data-target="tab-generation">
            Live Generation
        </div>
        <div class="nav-item" data-target="tab-maps">
            Maps
        </div>
        <div class="nav-item" data-target="tab-environment">
            Environment
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content">
        
        <!-- Live Generation Tab (Default) -->
        <div id="tab-generation" class="tab-content active">
            <div id="charts-container">
                <div class="chart-header">
                    <h2>Generation by Fuel Type</h2>
                    <p>Live outturn generation across Great Britain (BMRS) <span id="chart-status" style="color: #ef4444; font-weight: bold; margin-left: 10px;"></span></p>
                </div>
                <div class="chart-card">
                    <div style="display: flex; height: 100%; gap: 20px;">
                        <div style="flex: 1; position: relative; min-width: 0;">
                            <canvas id="generationChart"></canvas>
                        </div>
                        <div id="custom-legend" style="width: 180px; display: flex; flex-direction: column; gap: 8px; justify-content: center; overflow-y: visible;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Maps Tab -->
        <div id="tab-maps" class="tab-content">
            <!-- UI Overlay for Maps -->
            <div id="map-overlay">
                <!-- Dropdown -->
                <div class="glass-panel">
                    <select id="map-selector" class="custom-select">
                        <option value="solar">Solar PV Generation</option>
                        <!-- Future maps will be added here -->
                    </select>
                </div>

                <!-- Total Stats Card (Currently tied to Solar map) -->
                <div id="solar-stats" class="glass-panel" style="cursor: pointer;">
                    <div id="stats-title" class="stats-title">Select a country</div>
                    <div id="stats-value-container" class="stats-value" style="display: none;">
                        <span id="total-gen-display" class="stats-number">--</span>
                        <span class="stats-unit">MW</span>
                    </div>
                    <div class="status-indicator">
                        <div class="status-dot pulse" id="status-dot"></div>
                        <span id="status-text">Connecting...</span>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div id="map"></div>
        </div>

        <!-- Environment Tab -->
        <div id="tab-environment" class="tab-content">
            <div id="env-map-overlay">
                <div class="glass-panel">
                    <select id="env-map-selector" class="custom-select">
                        <option value="rivers">River Levels</option>
                    </select>
                </div>
                <div id="env-stats" class="glass-panel">
                    <div class="stats-title">Data Status</div>
                    <div class="status-indicator">
                        <div class="status-dot pulse" id="env-status-dot"></div>
                        <span id="env-status-text">Connecting...</span>
                    </div>
                </div>
                
                <div id="env-legend" class="glass-panel">
                    <div class="stats-title" style="margin-bottom: 8px;">River Level</div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #ef4444;"></div>
                        <span>High (Above Normal)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #10b981;"></div>
                        <span>Normal</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #fcd34d;"></div>
                        <span>Low (Below Normal)</span>
                    </div>
                </div>
            </div>
            <div id="env-map"></div>
        </div>

    </main>

    <!-- Application Modules -->
    <script type="module" src="app.js"></script>

</body>
</html>
