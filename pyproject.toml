[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-energy-dashboard"
version = "0.1.0"
description = "UK Energy Dashboard and Visualisations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "slowapi>=0.1.0",
    "uvicorn[standard]>=0.49.0",
    "entsoe-py>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.0",
    "pytest-asyncio",
    "pytest-httpx",
    "requests>=2.34.0",
]
dev = [
    "ruff",
    "uk-energy-dashboard[test]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
asyncio_mode = "auto"
testpaths = [
    "src/backend/tests",
]
pythonpath = [
    "src/backend",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults (FastAPI uses this heavily)
]
